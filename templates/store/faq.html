{% extends 'base.html' %}
{% block title %}FAQ{% endblock %}

{% block content %}
<div class="container" style="padding-block:2.5rem;max-width:780px">
  <nav class="breadcrumb" aria-label="Breadcrumb">
    <a href="{% url 'store:home' %}">Home</a>
    <span class="breadcrumb__sep">›</span>
    <span aria-current="page">FAQ</span>
  </nav>
  <div style="text-align:center;margin-bottom:2.5rem">
    <h1 style="font-size:2rem;color:var(--clr-plum)">Frequently Asked Questions 💬</h1>
  </div>

  <div style="display:flex;flex-direction:column;gap:1rem">
    {% for item in faqs %}
    <details class="card" style="padding:1.25rem" {% if forloop.first %}open{% endif %}>
      <summary style="font-family:var(--font-heading);font-size:1rem;color:var(--clr-plum);cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center">
        {{ item.question }}
        <span style="font-size:1.2rem;color:var(--clr-primary)" aria-hidden="true">+</span>
      </summary>
      <p style="margin-top:.75rem;color:var(--clr-text-muted);font-size:.92rem;line-height:1.7">{{ item.answer }}</p>
    </details>
    {% endfor %}
  </div>

  <div style="text-align:center;margin-top:2.5rem;padding:1.5rem;background:var(--clr-bg-soft);border-radius:var(--radius-lg)">
    <p style="color:var(--clr-text-muted);margin-bottom:1rem">Still have questions? We're here to help!</p>
    <a href="{% url 'store:contact' %}" class="btn btn-primary">Contact Us</a>
  </div>
</div>
{% endblock %}
